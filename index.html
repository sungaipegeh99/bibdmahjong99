<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BIBDMAHJONG99 - Demo Slot Pragmatic</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
    }
    header {
      background: #d90429;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo img {
      height: 40px;
    }
    .logo span {
      font-size: 24px;
      font-weight: bold;
    }
    .register-btn {
      background: #ffcc00;
      color: #000;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    .register-btn:hover {
      background: #e6b800;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .game-card {
      background: #222;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 0 10px #000;
    }
    .game-card img {
      width: 100%;
      border-radius: 10px;
    }
    .game-card a {
      display: block;
      margin-top: 10px;
      text-decoration: none;
      background: #ffcc00;
      color: #000;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <img src="https://via.placeholder.com/40x40.png?text=B" alt="Logo">
      <span>BIBDMAHJONG99</span>
    </div>
    <a href="https://example.com/daftar" class="register-btn" target="_blank">DAFTAR SEKARANG</a>
  </header>

  <div class="grid">
    <div class="game-card">
      <img src="https://via.placeholder.com/250x150?text=Starlight+Princess" alt="Starlight Princess">
      <a href="https://demopplay.pro/games/starlight-princess/" target="_blank">Mainkan</a>
    </div>
    <div class="game-card">
      <img src="https://via.placeholder.com/250x150?text=Gates+of+Olympus" alt="Gates of Olympus">
      <a href="https://demopplay.pro/games/gates-of-olympus/" target="_blank">Mainkan</a>
    </div>
    <div class="game-card">
      <img src="https://via.placeholder.com/250x150?text=Sweet+Bonanza" alt="Sweet Bonanza">
      <a href="https://demopplay.pro/games/sweet-bonanza/" target="_blank">Mainkan</a>
    </div>
  </div>

</body>
</html>
